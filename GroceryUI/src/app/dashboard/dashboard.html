
<div class="dashboard-container">

  <div class="dashboard-header">
    <h2>🌿 Dashboard</h2>
    <p>Welcome! Here's your grocery store overview.</p>
  </div>

  <div class="stats-grid">

    <div class="stat-card products-card" routerLink="/products">
      <div class="stat-icon">🛍️</div>
      <div class="stat-info">
        <p>Total Products</p>
        <h3>{{ totalProducts }}</h3>
      </div>
    </div>

    <div class="stat-card categories-card" routerLink="/categories">
      <div class="stat-icon">📦</div>
      <div class="stat-info">
        <p>Total Categories</p>
        <h3>{{ totalCategories }}</h3>
      </div>
    </div>

    <div class="stat-card stock-card" (click)="openLowStockProducts()">
      <div class="stat-icon">⚠️</div>
      <div class="stat-info">
        <p>Low Stock Products</p>
        <h3>{{ lowStockProducts }}</h3>
      </div>
    </div>

    <div class="stat-card orders-card" routerLink="/admin-orders">
      <div class="stat-icon">📋</div>
      <div class="stat-info">
        <p>Total Orders</p>
        <h3>{{ totalOrders }}</h3>
      </div>
    </div>

    <div class="stat-card sales-card">
      <div class="stat-icon">💰</div>
      <div class="stat-info">
        <p>Total Sales</p>
        <h3>₹{{ totalSales }}</h3>
      </div>
    </div>

  </div>
</div>
